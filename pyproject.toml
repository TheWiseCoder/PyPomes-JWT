[build-system]
requires = [
    "hatchling>=1.32.4"
]
build-backend = "hatchling.build"

[project]
name = "pypomes_jwt"
version = "1.4.4"
authors = [
  { name="GT Nunes", email="wisecoder01@gmail.com" }
]
description = "A collection of Python pomes, penyeach (JWT module)"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "cryptography>=50.0.2",
    "Flask>=3.1.3",
    "PyJWT>=2.15.1",
    "pypomes-core>=3.3.2",
    "pypomes-crypto>=0.8.2",
    "pypomes-db>=3.2.4"
]

[project.urls]
"Homepage" = "https://github.com/TheWiseCoder/PyPomes-JWT"
"Bug Tracker" = "https://github.com/TheWiseCoder/PyPomes-JWT/issues"
